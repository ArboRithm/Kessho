    <polygon points="3.750,16.763 6.500,21.526 12.000,21.526 9.250,16.763" fill="#295648"/>
    <polygon points="9.250,16.763 12.000,21.526 17.500,21.526 14.750,16.763" fill="#398b6b"/>
